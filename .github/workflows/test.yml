name: Test and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/property-display-regressions]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run golden evaluation and production build
        run: pnpm build
      - name: Run test suite
        run: pnpm test
